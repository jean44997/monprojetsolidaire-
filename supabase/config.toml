project_id = "monprojetsolidaire"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5180"
additional_redirect_urls = ["http://127.0.0.1:5180/**", "http://localhost:5180/**", "https://monprojetsolidaire.vercel.app/**"]
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
enable_confirmations = false
secure_password_change = true
max_frequency = "60s"

[auth.sms]
enable_signup = false
enable_confirmations = false

[functions.payment-webhook]
verify_jwt = false

[functions.jeko-checkout]
verify_jwt = false

[functions.jeko-payment-status]
verify_jwt = false
